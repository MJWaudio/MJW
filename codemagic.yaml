workflows:
  ios-starter:
    name: MJW AUDIO BOX iOS starter
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build iOS Simulator app
        script: |
          xcodebuild \
            -project MJWAudioBox.xcodeproj \
            -scheme MJWAudioBox \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
