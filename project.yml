
name: MJWAudioBox
options:
  bundleIdPrefix: com.mjwaudio
  deploymentTarget:
    iOS: "17.0"

targets:
  MJWAudioBox:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - LICENSE
          - project.yml
          - codemagic.yaml
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mjwaudio.mjwaudiobox
        PRODUCT_NAME: MJW AUDIO BOX
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MJW AUDIO BOX
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
